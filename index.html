<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector de Color RGB</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">Selector de Color RGB</h1>

    <div class="row justify-content-center">
        <div class="col-md-6">

<div class="row justify-content-center">
    <div class="col-md-8 neon-card">

        <div class="row align-items-center">
            <!-- Controles RGB -->
            <div class="col-md-9">

                <!-- Rojo -->
                <div class="mb-3">
                    <label class="form-label text-neon-red">Rojo (R)</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="range" class="form-range red-range" id="red" min="0" max="255">
                        <input type="number" class="form-control number-input" id="redNum" min="0" max="255">
                    </div>
                </div>

                <!-- Verde -->
                <div class="mb-3">
                    <label class="form-label text-neon-green">Verde (G)</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="range" class="form-range green-range" id="green" min="0" max="255">
                        <input type="number" class="form-control number-input" id="greenNum" min="0" max="255">
                    </div>
                </div>

                <!-- Azul -->
                <div class="mb-3">
                    <label class="form-label text-neon-blue">Azul (B)</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="range" class="form-range blue-range" id="blue" min="0" max="255">
                        <input type="number" class="form-control number-input" id="blueNum" min="0" max="255">
                    </div>
                </div>

            </div>

            <!-- Color Picker cuadrado -->
            <div class="col-md-3 text-center">
                <label class="form-label text-neon">Color</label>
                <input type="color" id="colorPicker" class="neon-color-picker">
            </div>
        </div>

        <!-- Recuadro del color -->
        <div id="colorBox" class="color-box-neon mt-4"></div>

        <!-- Valores -->
        <p class="text-center neon-text mt-3" id="rgbValue">RGB(0, 0, 0)</p>
        <p class="text-center neon-text" id="hexValue">#000000</p>

    </div>
</div>


<!-- JS propio -->
<script src="script.js"></script>
</body>
</html>
